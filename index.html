<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYMAN MARKET - محلات الواحة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial}
body{background:#f5f5f5}
header{background:#007a5e;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:24px}
header p{font-size:13px;opacity:.9}
.search{padding:12px}
.search input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:16px}
.cats{display:flex;gap:8px;overflow:auto;padding:0 12px 12px}
.cats button{white-space:nowrap;padding:8px 14px;border-radius:20px;background:#fff;border:1px solid #ddd;cursor:pointer}
.cats button.active{background:#007a5e;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;height:140px;object-fit:cover;background:#eee}
.card .info{padding:10px}
.card h3{font-size:15px}
.card .price{color:#007a5e;font-weight:bold;margin:6px 0}
.card button{width:100%;padding:10px;border:none;border-radius:8px;background:#25D366;color:#fff;font-size:15px;cursor:pointer}
.addbox{background:#fff;margin:12px;padding:15px;border-radius:12px}
.addbox h3{margin-bottom:10px}
.addbox input,.addbox select{width:100%;padding:11px;margin-bottom:8px;border-radius:8px;border:1px solid #ddd;font-size:15px}
.addbox .save{width:100%;padding:12px;background:#007a5e;color:#fff;border:none;border-radius:8px;font-size:16px}
.addbox .clear{width:100%;padding:10px;background:#ff3b30;color:#fff;border:none;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<header><h1>AYMAN MARKET</h1><p>محلات الواحة - فوربرنقا</p></header>
<div class="search"><input id="search" placeholder="ابحث عن منتج..."></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div class="addbox">
<h3>أضف بضاعتك الحقيقية فقط</h3>
<input id="pname" placeholder="اسم المنتج - مثال: سكر 10 كيلو">
<input id="pprice" type="number" placeholder="السعر - مثال: 45000">
<input id="pqty" type="number" placeholder="الكمية">
<select id="pcat"><option>مواد غذائية</option><option>منظفات</option><option>بقالة</option><option>أخرى</option></select>
<input id="pimg" placeholder="رابط صورة (اختياري)">
<button class="save" onclick="addProduct()">حفظ المنتج</button>
<button class="clear" onclick="clearAll()">مسح كل المنتجات القديمة</button>
</div>
<script>
let products = JSON.parse(localStorage.getItem('ayman_products')||'[]');
let cats = ['الكل','مواد غذائية','منظفات','بقالة','أخرى'];
let activeCat='الكل';
function renderCats(){
document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');
}
function setCat(c){activeCat=c;renderCats();render();}
function render(){
let q=document.getElementById('search').value||'';
let list=products.filter(p=>(activeCat==='الكل'||p.cat===activeCat)&&p.name.includes(q));
document.getElementById('grid').innerHTML=list.length?list.map((p,i)=>`
<div class="card">
<img src="${p.img||'https://via.placeholder.com/300x200?text='+encodeURIComponent(p.name)}">
<div class="info"><h3>${p.name}</h3><div>الكمية: ${p.qty}</div><div class="price">${p.price} جنيه</div>
<button onclick="order('${p.name}','${p.price}')">اطلب بالواتساب</button></div></div>`).join(''):'<p style="grid-column:1/-1;text-align:center;padding:20px">لا توجد منتجات بعد، أضف بضاعتك من الأسفل</p>';
}
function addProduct(){
let name=document.getElementById('pname').value.trim();
let price=document.getElementById('pprice').value;
let qty=document.getElementById('pqty').value||1;
let cat=document.getElementById('pcat').value;
let img=document.getElementById('pimg').value;
if(!name||!price){alert('اكتب الاسم والسعر');return;}
products.push({name,price,qty,cat,img});
localStorage.setItem('ayman_products',JSON.stringify(products));
render();alert('تم حفظ المنتج');
}
function clearAll(){if(confirm('تمسح كل المنتجات؟')){products=[];localStorage.removeItem('ayman_products');render();}}
function order(name,price){
let msg=encodeURIComponent('السلام عليكم، داير أطلب: '+name+' - السعر: '+price+' جنيه - من متجر AYMAN MARKET');
window.open(`https://wa.me/23567651851?text=${msg}`, '_blank');
}
document.getElementById('search').addEventListener('input',render);
renderCats();render();
</script>
</body>
</html>
