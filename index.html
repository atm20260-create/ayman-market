<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYMAN MARKET - سوق فوربرنقا</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0}
header{background:#0b7a43;color:#fff;padding:15px;text-align:center;position:sticky;top:0}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;font-size:13px}
.search{padding:12px;text-align:center}
.search input{width:90%;padding:12px;border-radius:10px;border:1px solid #ccc;font-size:15px}
.cats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:5px 10px}
.cats button{background:#fff;border:1px solid #ddd;padding:8px 14px;border-radius:20px;cursor:pointer}
.cats button.active{background:#0b7a43;color:#fff}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;padding:10px;text-align:center}
.card img{width:100%;height:120px;object-fit:cover;border-radius:10px}
.price{color:#0b7a43;font-weight:bold;font-size:16px}
.seller{font-size:12px;color:#666}
.btn{background:#0b7a43;color:#fff;border:none;padding:10px;width:100%;border-radius:8px;margin-top:5px;font-size:14px}
#cart{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #0b7a43;padding:12px;text-align:center;box-shadow:0 -2px 10px rgba(0,0,0,.1)}
#cart button{background:#ff8c00;color:#fff;border:none;padding:12px 25px;border-radius:10px;font-size:16px}
</style>
</head>
<body>
<header><h1>AYMAN MARKET</h1><p>سوق فوربرنقا الإلكتروني | اطلب أونلاين واستلم من محل التاجر - الدفع كاش</p></header>
<div class="search"><input id="search" onkeyup="filter()" placeholder="ابحث عن سكر، زيت، تلفون..."></div>
<div class="cats">
<button class="active" onclick="show('all',this)">الكل</button>
<button onclick="show('food',this)">مواد غذائية</button>
<button onclick="show('elec',this)">إلكترونيات</button>
<button onclick="show('cloth',this)">ملابس</button>
</div>
<div class="products" id="products"></div>
<div id="cart">السلة: <span id="count">0</span> منتج | الإجمالي: <span id="total">0</span> ج.س<br><br><button onclick="order()">تأكيد الطلب - استلام من المحل</button></div>
<script>
let products=[
{name:"سكر 10 كيلو",price:45000,cat:"food",seller:"دكان النور - فوربرنقا",img:"https://via.placeholder.com/300x200?text=Sugar"},
{name:"زيت 4 لتر",price:38000,cat:"food",seller:"دكان النور - فوربرنقا",img:"https://via.placeholder.com/300x200?text=Oil"},
{name:"تلفون سامسونج",price:320000,cat:"elec",seller:"ستار فون - فوربرنقا",img:"https://via.placeholder.com/300x200?text=Phone"},
{name:"سماعة بلوتوث",price:25000,cat:"elec",seller:"ستار فون - فوربرنقا",img:"https://via.placeholder.com/300x200?text=Earphone"},
{name:"جلابية رجالي",price:55000,cat:"cloth",seller:"مشغل الأمل - فوربرنقا",img:"https://via.placeholder.com/300x200?text=Jalabiya"},
{name:"تيشيرت",price:18000,cat:"cloth",seller:"مشغل الأمل - فوربرنقا",img:"https://via.placeholder.com/300x200?text=Tshirt"},
];
let cart=[],filterCat="all";
function render(){
let q=document.getElementById("search").value.toLowerCase();
let html="";
products.filter(p=>(filterCat=="all"||p.cat==filterCat)&&p.name.includes(q)).forEach((p,i)=>{
html+=`<div class="card"><img src="${p.img}"><h3>${p.name}</h3><p class="seller">${p.seller}</p><p class="price">${p.price.toLocaleString()} ج.س</p><button class="btn" onclick="add(${products.indexOf(p)})">أضف للسلة</button></div>`;
});
document.getElementById("products").innerHTML=html;
}
function show(c,el){filterCat=c;document.querySelectorAll(".cats button").forEach(b=>b.classList.remove("active"));el.classList.add("active");render();}
function filter(){render();}
function add(i){cart.push(products[i]);let t=cart.reduce((s,p)=>s+p.price,0);document.getElementById("count").innerText=cart.length;document.getElementById("total").innerText=t.toLocaleString();alert("تمت الإضافة للسلة");}
function order(){if(cart.length==0){alert("السلة فارغة");return;}let num="AM-"+Math.floor(Math.random()*90000+10000);let t=cart.reduce((s,p)=>s+p.price,0);alert("تم استلام طلبك!\\nرقم الطلب: "+num+"\\nالإجمالي: "+t.toLocaleString()+" ج.س\\nاذهب لمحل التاجر وادفع كاش واستلم.");cart=[];document.getElementById("count").innerText=0;document.getElementById("total").innerText=0;}
render();
</script>
</body>
</html>
