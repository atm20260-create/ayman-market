<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYMAN MARKETING - محلات الواحة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial}
body{background:#f8f8f8}
header{background:#111;color:#fff;padding:22px 15px;text-align:center;border-bottom:3px solid #d4af37}
header h1{font-size:28px;color:#d4af37}
header p{font-size:13px;color:#ccc;margin-top:6px}
.search{padding:12px}
.search input{width:100%;padding:13px;border-radius:12px;border:1px solid #ddd;font-size:16px}
.cats{display:flex;gap:8px;overflow:auto;padding:0 12px 12px}
.cats button{white-space:nowrap;padding:9px 16px;border-radius:20px;background:#fff;border:1px solid #ddd;cursor:pointer;font-weight:bold}
.cats button.active{background:#111;color:#d4af37}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.card img{width:100%;height:165px;object-fit:cover;background:#f0f0f0}
.card .info{padding:12px}
.card h3{font-size:15px;line-height:1.4;min-height:42px}
.card .price{color:#b8860b;font-weight:900;margin:6px 0;font-size:18px}
.cash{color:#d32f2f;font-weight:bold;font-size:13px;background:#ffebee;padding:5px 8px;border-radius:6px;display:inline-block}
.owner{background:#fff8e1;border:1px solid #ffe082;padding:8px;border-radius:8px;font-size:13px;margin:8px 0;line-height:1.6}
.card button{width:100%;padding:11px;border:none;border-radius:9px;background:#25D366;color:#fff;font-size:15px;cursor:pointer;font-weight:bold;margin-top:5px}
.card button.call{background:#111;color:#d4af37}
.about{background:#111;color:#ddd;margin:12px;padding:18px;border-radius:14px;text-align:center;line-height:1.8;font-size:14px}
.about b{color:#d4af37}
footer{background:#000;color:#aaa;text-align:center;padding:14px;font-size:12px}
</style>
</head>
<body>
<header><h1>AYMAN MARKETING</h1><p>محلات الواحة • فوربرنقا • ولاعات أصلية • زينة كفرات الركشات</p></header>
<div class="search"><input id="search" placeholder="ابحث هنا..." oninput="render()"></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div class="about"><b>AYMAN MARKETING - محلات الواحة</b><br>متجر من فوربرنقا - السودان<br><b>المؤسس: أيمن محمد صالح يعقوب</b></div>
<footer>AYMAN MARKETING © 2026 | فوربرنقا - السودان</footer>
<script>
var products=[
{name:"زينة كفر ركشة وردية - نجمة",price:70000,cat:"زينة كفرات الركشات",img:"wheel-pink.jpg",owner:"النعمان",phone:"+235 85152670",cash:1},
{name:"زينة كفر ركشة خضراء - نجمة",price:70000,cat:"زينة كفرات الركشات",img:"wheel-green.jpg",owner:"النعمان",phone:"+235 85152670",cash:1},
{name:"زينة كفرات ركشة - طقم وردي + أخضر",price:140000,cat:"زينة كفرات الركشات",img:"wheel-both.jpg",owner:"النعمان",phone:"+235 85152670",cash:1},
{name:"زينة كفر ركشة - من الخلف",price:70000,cat:"زينة كفرات الركشات",img:"wheel-back.jpg",owner:"النعمان",phone:"+235 85152670",cash:1},
{name:"ولاعة سوداء - أم كورة حديد",price:4000,cat:"ولاعات",img:"black1.jpg",owner:"أيمن محمد صالح يعقوب",phone:"+235 85152670",cash:0},
{name:"ولاعة سوداء - KENT",price:4000,cat:"ولاعات",img:"black2.jpg",owner:"أيمن محمد صالح يعقوب",phone:"+235 85152670",cash:0},
{name:"ولاعة سوداء سادة طويلة",price:4000,cat:"ولاعات",img:"black3.jpg",owner:"أيمن محمد صالح يعقوب",phone:"+235 85152670",cash:0},
{name:"ولاعة ذهبية - أبو سيفين سمك",price:4000,cat:"ولاعات",img:"gold1.jpg",owner:"أيمن محمد صالح يعقوب",phone:"+235 85152670",cash:0},
{name:"ولاعة ذهبية - كلاش M",price:4000,cat:"ولاعات",img:"gold2.jpg",owner:"أيمن محمد صالح يعقوب",phone:"+235 85152670",cash:0},
{name:"ولاعة ذهبية سادة لماعة",price:4000,cat:"ولاعات",img:"gold3.jpg",owner:"أيمن محمد صالح يعقوب",phone:"+235 85152670",cash:0},
{name:"ولاعة صغيرة - ORIS",price:1000,cat:"ولاعات",img:"small1.jpg",owner:"أيمن محمد صالح يعقوب",phone:"+235 85152670",cash:0},
{name:"ولاعة صغيرة - ZAKI",price:1000,cat:"ولاعات",img:"small2.jpg",owner:"أيمن محمد صالح يعقوب",phone:"+235 85152670",cash:0}
];
var cats=['الكل','زينة كفرات الركشات','ولاعات'];
var activeCat='الكل';
function renderCats(){document.getElementById('cats').innerHTML=cats.map(function(c){return '<button class="'+(c===activeCat?'active':'')+'" onclick="setCat(\''+c+'\')">'+c+'</button>'}).join('');}
function setCat(c){activeCat=c;renderCats();render();}
function cleanPhone(p){return p.replace(/[^0-9]/g,'');}
function render(){
var q=document.getElementById('search').value||'';
var list=products.filter(function(p){return (activeCat==='الكل'||p.cat===activeCat) && p.name.indexOf(q)>-1;});
document.getElementById('grid').innerHTML=list.map(function(p){
return '<div class="card"><img src="'+p.img+'" onerror="this.style.display=\'none\'"><div class="info"><h3>'+p.name+'</h3><div class="price">'+p.price+' جنيه</div>'+(p.cash?'<div class="cash">💵 كاش فقط - ما بنكك</div>':'')+'<div class="owner">👤 <b>'+p.owner+'</b><br>📞 <span dir="ltr">'+p.phone+'</span></div><button onclick="order(\''+p.name+'\',\''+p.price+'\',\''+p.owner+'\',\''+p.phone+'\')">اطلب بالواتساب</button><button class="call" onclick="window.location.href=\'tel:'+cleanPhone(p.phone)+'\'">📞 اتصل بـ '+p.owner+'</button></div></div>';
}).join('');
}
function order(name,price,owner,phone){var msg=encodeURIComponent('السلام عليكم يا '+owner+'، داير أطلب: '+name+' - السعر: '+price+' جنيه - من AYMAN MARKETING');window.open('https://wa.me/'+cleanPhone(phone)+'?text='+msg,'_blank');}
renderCats();render();
</script>
</body>
</html>
