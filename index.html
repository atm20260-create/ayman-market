<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYMAN MARKETING</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial}
body{background:#fff}
.top{background:#0f3d2e;padding:18px 14px 28px;color:#fff;border-radius:0 0 28px 28px}
.top .row{display:flex;align-items:center;justify-content:space-between}
.top .logo-box{display:flex;align-items:center;gap:10px}
.top .avatar{width:52px;height:52px;background:#ffc107;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#0f3d2e}
.top h1{font-size:22px;line-height:1.2}
.top h1 span{color:#ffc107;font-size:13px;font-weight:400;display:block}
.top .loc{background:rgba(255,255,255,.15);padding:7px 12px;border-radius:20px;font-size:12px}
.searchbox{margin:-16px 14px 12px;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.12);padding:6px;display:flex;align-items:center}
.searchbox input{flex:1;border:none;outline:none;padding:12px;font-size:15px}
.searchbox span{font-size:18px;padding:0 6px}
.cats{display:flex;gap:8px;overflow:auto;padding:4px 14px 14px}
.cats button{padding:10px 20px;border-radius:12px;border:1px solid #eee;background:#f8f8f8;cursor:pointer;font-weight:bold;font-size:14px;white-space:nowrap}
.cats button.active{background:#0f3d2e;color:#ffc107;border-color:#0f3d2e}
.grid{padding:0 14px 90px;display:flex;flex-direction:column;gap:14px}
.card{display:flex;background:#fff;border:1px solid #f0f0f0;border-radius:20px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.card .img{width:135px;min-height:145px;background:#fff7d6;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.card .img img{width:100%;height:100%;object-fit:cover}
.card .img .emoji{font-size:48px}
.card .info{flex:1;padding:12px 12px 12px 10px}
.card .info h3{font-size:15px;line-height:1.5}
.card .tag{display:inline-block;background:#e8f5e9;color:#2e7d32;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:bold;margin:6px 0}
.card .price{font-size:22px;font-weight:900;color:#0f3d2e}
.card .price small{font-size:12px;color:#999;font-weight:400}
.card .merchant{font-size:12px;color:#666;line-height:1.6;margin-top:4px}
.card .merchant b{color:#111}
.cash{color:#d32f2f;font-size:11px;font-weight:bold}
.actions{display:flex;gap:6px;margin-top:9px}
.actions button{flex:1;padding:10px;border:none;border-radius:12px;font-weight:900;cursor:pointer;font-size:13px}
.btn-wa{background:#25D366;color:#fff}
.btn-call{background:#0f3d2e;color:#ffc107}
.editrow{display:flex;gap:6px;margin-top:6px}
.editrow button{flex:1;padding:7px;border:none;background:#f5f5f5;border-radius:9px;cursor:pointer;font-size:11px;color:#777}
.footer{text-align:center;padding:14px;color:#aaa;font-size:12px}
.fab{position:fixed;bottom:18px;left:18px;background:#ffc107;color:#0f3d2e;border:none;width:56px;height:56px;border-radius:50%;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.3);z-index:20}
.fab2{position:fixed;bottom:18px;right:18px;background:#0f3d2e;color:#ffc107;border:none;padding:0 18px;height:56px;border-radius:28px;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.3);z-index:20}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;padding:16px;overflow:auto}
.modal .box{background:#fff;border-radius:20px;padding:20px;max-width:460px;margin:20px auto}
.modal h2{margin-bottom:12px;text-align:center}
.modal label{font-size:13px;font-weight:bold;display:block;margin:11px 0 5px}
.modal input,.modal select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px}
.modal .img-preview{width:100%;height:150px;background:#f5f5f5;border:2px dashed #ddd;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:36px}
.modal .img-preview img{width:100%;height:100%;object-fit:cover}
.modal .row{display:flex;gap:8px}
.modal .row button{flex:1;padding:12px;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:16px}
.save{background:#0f3d2e;color:#ffc107}
.cancel{background:#eee}
</style>
</head>
<body>
<div class="top">
<div class="row">
<div class="logo-box"><div class="avatar">A</div><h1>AYMAN MARKETING<span>محلات الواحة - فوربرنقا</span></h1></div>
<div class="loc">📍 فوربرنقا</div>
</div>
</div>
<div class="searchbox"><span>🔍</span><input id="search" placeholder="دور على بضاعة..." oninput="render()"></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div class="footer">AYMAN MARKETING • 2026</div>
<button class="fab" onclick="openAdd()">+</button>
<button class="fab2" onclick="openMerchant()">+ تاجر</button>

<div class="modal" id="modalMerchant"><div class="box"><h2>إضافة تاجر</h2>
<label>اسم التاجر</label><input id="m_name" placeholder="اسم التاجر">
<label>رقم التاجر</label><input id="m_phone" placeholder="+235" dir="ltr">
<label>عنوان التاجر</label><input id="m_address" placeholder="فوربرنقا">
<div class="row"><button class="save" onclick="saveMerchant()">حفظ</button><button class="cancel" onclick="closeMerchant()">إلغاء</button></div>
</div></div>

<div class="modal" id="modal"><div class="box"><h2>إضافة بضاعة</h2>
<div class="img-preview" id="preview" onclick="document.getElementById('fileImg').click()">📷 صورة البضاعة</div>
<input type="file" id="fileImg" accept="image/*" style="display:none" onchange="onImage(this)">
<label>اسم البضاعة</label><input id="f_name" placeholder="اسم البضاعة">
<label>السعر</label><input id="f_price" type="number" placeholder="4000">
<label>القسم</label><select id="f_cat"><option>ولاعات</option><option>زينة كفرات الركشات</option><option>أخرى</option></select>
<label>التاجر</label><select id="f_merchant"></select>
<label>طريقة الدفع</label><select id="f_cash"><option value="0">بنكك + كاش</option><option value="1">كاش فقط</option></select>
<div class="row"><button class="save" onclick="saveProduct()">حفظ</button><button class="cancel" onclick="closeAdd()">إلغاء</button></div>
</div></div>

<div class="modal" id="modalPrice"><div class="box"><h2>تعديل السعر</h2>
<p id="priceProdName" style="text-align:center;color:#666"></p>
<label>السعر الجديد</label><input id="newPrice" type="number">
<div class="row"><button class="save" onclick="confirmPrice()">حفظ</button><button class="cancel" onclick="closePrice()">إلغاء</button></div>
</div></div>

<script>
var DEFAULT_MERCHANTS=[{name:"أيمن محمد صالح يعقوب",phone:"+235 67651851",address:"فوربرنقا - محلات الواحة"},{name:"النعمان",phone:"+235 85152670",address:"فوربرنقا - محلات النعمان"}];
var DEFAULT_PRODUCTS=[
{name:"زينة كفر ركشة وردية - نجمة",price:70000,cat:"زينة كفرات الركشات",img:"",emoji:"🌸",owner:"النعمان",phone:"+235 85152670",address:"فوربرنقا - محلات النعمان",cash:1},
{name:"زينة كفر ركشة خضراء - نجمة",price:70000,cat:"زينة كفرات الركشات",img:"",emoji:"🟢",owner:"النعمان",phone:"+235 85152670",address:"فوربرنقا - محلات النعمان",cash:1},
{name:"زينة كفرات ركشة - طقم وردي + أخضر",price:140000,cat:"زينة كفرات الركشات",img:"",emoji:"🌸🟢",owner:"النعمان",phone:"+235 85152670",address:"فوربرنقا - محلات النعمان",cash:1},
{name:"ولاعة سوداء - أم كورة حديد",price:4000,cat:"ولاعات",img:"",emoji:"🔥",owner:"أيمن محمد صالح يعقوب",phone:"+235 67651851",address:"فوربرنقا - محلات الواحة",cash:0},
{name:"ولاعة ذهبية - أبو سيفين سمك",price:4000,cat:"ولاعات",img:"",emoji:"✨",owner:"أيمن محمد صالح يعقوب",phone:"+235 67651851",address:"فوربرنقا - محلات الواحة",cash:0},
{name:"ولاعة صغيرة - ORIS",price:1000,cat:"ولاعات",img:"",emoji:"🔥",owner:"أيمن محمد صالح يعقوب",phone:"+235 67651851",address:"فوربرنقا - محلات الواحة",cash:0}
];
var merchants=[], products=[];
try{ var s1=localStorage.getItem('ayman_m_v5'); merchants=s1?JSON.parse(s1):DEFAULT_MERCHANTS; }catch(e){ merchants=DEFAULT_MERCHANTS; }
try{ var s2=localStorage.getItem('ayman_p_v5'); products=s2?JSON.parse(s2):DEFAULT_PRODUCTS; }catch(e){ products=DEFAULT_PRODUCTS; }
if(!Array.isArray(merchants)) merchants=DEFAULT_MERCHANTS;
if(!Array.isArray(products)) products=DEFAULT_PRODUCTS;
var cats=['الكل','ولاعات','زينة كفرات الركشات','أخرى']; var activeCat='الكل'; var tempImg=''; var editPriceIndex=-1;

/* تنظيف النصوص قبل عرضها في الصفحة (حماية من الأكواد الخبيثة) */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* توحيد الحروف العربية للبحث (أ إ آ = ا ، ة = ه ، ى = ي) وحذف التشكيل */
function norm(s){ return String(s||'').toLowerCase().replace(/[ً-ٰٟ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه'); }

function saveAll(){
  try{ localStorage.setItem('ayman_m_v5',JSON.stringify(merchants)); localStorage.setItem('ayman_p_v5',JSON.stringify(products)); return true; }
  catch(e){ alert('تعذر حفظ البيانات: مساحة المتصفح ممتلئة. احذف بعض الصور أو البضائع القديمة.'); return false; }
}
function cleanPhone(p){ return (p||'').replace(/[^0-9]/g,''); }
function renderMerchants(){ var sel=document.getElementById('f_merchant'); sel.innerHTML=merchants.map(function(m,i){ return '<option value="'+i+'">'+esc(m.name)+'</option>'; }).join(''); }
function openMerchant(){ document.getElementById('modalMerchant').style.display='block'; }
function closeMerchant(){ document.getElementById('modalMerchant').style.display='none'; }
function saveMerchant(){
  var name=document.getElementById('m_name').value.trim(); var phone=document.getElementById('m_phone').value.trim(); var address=document.getElementById('m_address').value.trim();
  if(!name||!phone){ alert('اكتب الاسم والرقم'); return; }
  if(cleanPhone(phone).length<8){ alert('رقم التاجر غير صحيح'); return; }
  merchants.push({name:name,phone:phone,address:address}); saveAll(); renderMerchants(); closeMerchant();
  document.getElementById('m_name').value=''; document.getElementById('m_phone').value=''; document.getElementById('m_address').value='';
}
function renderCats(){ document.getElementById('cats').innerHTML=cats.map(function(c,i){return '<button class="'+(c===activeCat?'active':'')+'" onclick="setCat('+i+')">'+esc(c)+'</button>'}).join(''); }
function setCat(i){ activeCat=cats[i]; renderCats(); render(); }
function render(){
  var q=norm((document.getElementById('search').value||'').trim());
  var list=products.filter(function(p){ return (activeCat==='الكل'||p.cat===activeCat) && norm(p.name).indexOf(q)>-1; });
  if(list.length===0){ document.getElementById('grid').innerHTML='<div style="background:#fff;padding:30px;border-radius:16px;text-align:center;color:#888">لا توجد بضاعة</div>'; return; }
  document.getElementById('grid').innerHTML=list.map(function(p){
    var realIdx=products.indexOf(p);
    var imgHtml=p.img?'<img src="'+esc(p.img)+'" onerror="this.style.display=\'none\'">':'<div class="emoji">'+esc(p.emoji||'🛍️')+'</div>';
    return '<div class="card"><div class="img">'+imgHtml+'</div><div class="info"><span class="tag">'+esc(p.cat)+'</span><h3>'+esc(p.name)+'</h3><div class="price">'+esc(p.price)+' <small>جنيه</small></div>'+(p.cash?'<div class="cash">كاش فقط</div>':'')+'<div class="merchant"><b>'+esc(p.owner)+'</b><br><span dir="ltr">'+esc(p.phone)+'</span> • '+esc(p.address||'')+'</div><div class="actions"><button class="btn-wa" onclick="order('+realIdx+')">واتساب</button><button class="btn-call" onclick="callP('+realIdx+')">اتصل</button></div><div class="editrow"><button onclick="openPrice('+realIdx+')">تعديل السعر</button><button onclick="delProduct('+realIdx+')">حذف</button></div></div></div>';
  }).join('');
}
function order(i){ var p=products[i]; if(!p) return; var msg=encodeURIComponent('السلام عليكم يا '+p.owner+'، داير أطلب: '+p.name+' - '+p.price+' جنيه'); window.open('https://wa.me/'+cleanPhone(p.phone)+'?text='+msg,'_blank'); }
function callP(i){ var p=products[i]; if(!p) return; window.location.href='tel:+'+cleanPhone(p.phone); }
function openAdd(){ document.getElementById('modal').style.display='block'; renderMerchants(); }
function closeAdd(){ document.getElementById('modal').style.display='none'; tempImg=''; document.getElementById('preview').innerHTML='📷 صورة البضاعة'; document.getElementById('fileImg').value=''; }

/* تصغير الصورة قبل حفظها حتى لا تملأ ذاكرة المتصفح */
function onImage(input){
  var file=input.files[0]; if(!file) return;
  var r=new FileReader();
  r.onload=function(e){
    var im=new Image();
    im.onload=function(){
      var max=700, w=im.width, h=im.height;
      if(w>max||h>max){ var k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k); }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      tempImg=c.toDataURL('image/jpeg',0.75);
      document.getElementById('preview').innerHTML='<img src="'+tempImg+'">';
    };
    im.onerror=function(){ alert('تعذر قراءة هذه الصورة'); };
    im.src=e.target.result;
  };
  r.readAsDataURL(file);
}
function saveProduct(){
  var name=document.getElementById('f_name').value.trim(); var price=document.getElementById('f_price').value.trim(); var cat=document.getElementById('f_cat').value; var mi=document.getElementById('f_merchant').value;
  var owner=merchants[mi]?merchants[mi].name:''; var phone=merchants[mi]?merchants[mi].phone:''; var address=merchants[mi]?merchants[mi].address:'';
  var cash=document.getElementById('f_cash').value==='1'?1:0;
  if(!name||!price||!owner){ alert('اكمل البيانات'); return; }
  if(!(Number(price)>0)){ alert('اكتب سعراً صحيحاً'); return; }
  products.unshift({name:name,price:Number(price),cat:cat,img:tempImg,emoji:'🛍️',owner:owner,phone:phone,address:address,cash:cash});
  saveAll(); closeAdd(); render();
  document.getElementById('f_name').value=''; document.getElementById('f_price').value='';
}
function delProduct(i){ if(!confirm('تمسح؟')) return; products.splice(i,1); saveAll(); render(); }
function openPrice(i){ editPriceIndex=i; document.getElementById('priceProdName').innerText=products[i].name; document.getElementById('newPrice').value=products[i].price; document.getElementById('modalPrice').style.display='block'; }
function closePrice(){ document.getElementById('modalPrice').style.display='none'; }
function confirmPrice(){ var v=document.getElementById('newPrice').value.trim(); if(!v||!(Number(v)>0)) return; products[editPriceIndex].price=Number(v); saveAll(); closePrice(); render(); }
renderMerchants(); renderCats(); render();
</script>
</body>
</html>
